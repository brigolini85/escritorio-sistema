name: Cenários de conversa
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: true
jobs:
  cenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0 # auditoria 6.8: fixa, a mesma do deploy.yml
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Auditoria 6.8: o segredo entra por env, não interpolado no script.
      - run: bash scripts/env-local.sh && printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_API_KEY" >> .env
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: pnpm --filter @escritorio/trabalhador cenarios
