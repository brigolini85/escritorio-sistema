# Auditoria 6.8: Supabase CLI em versão fixa; produção só a partir da main; cópia cifrada do banco (scripts/copia, a mesma
# da cópia semanal) antes do db push; a ordem é migração → contêiner, e no fim a publicação espera o trabalhador novo
# (construído depois da migração) responder 200 no /saude.
# Os contêineres: pelos webhooks do Easypanel, se os segredos existirem; sem eles, o dono publica no Easypanel (Deploy e
# depois Stop/Start no Trabalhador e no Painel) enquanto este job espera o /saude. docs/operacao.md, "Publicar".
name: Publicação
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ambiente:
        description: Ambiente
        type: choice
        options: [producao]
        required: true

permissions:
  contents: read

env:
  # A mesma versão usada nos testes locais. Trocar só depois de rodar `supabase test db` com a nova.
  SUPABASE_CLI_VERSAO: 2.118.0
  # Quanto tempo a publicação espera o trabalhador novo (dá tempo de publicar à mão no Easypanel).
  ESPERA_SAUDE_MINUTOS: 30

jobs:
  homologacao:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: homologacao
    timeout-minutes: 60
    concurrency:
      group: publicacao-homologacao
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSAO }}
      - name: Marcar o início da migração
        run: echo "INICIO=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Migração do banco
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" && supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      - name: Publicar os contêineres (depois da migração)
        env:
          WEBHOOK_TRABALHADOR: ${{ secrets.EASYPANEL_DEPLOY_TRABALHADOR }}
          WEBHOOK_PAINEL: ${{ secrets.EASYPANEL_DEPLOY_PAINEL }}
        run: bash scripts/publicacao/publicar-conteineres.sh
      - name: Conferir o trabalhador novo no /saude
        env:
          SAUDE_URL: ${{ secrets.TRABALHADOR_SAUDE_URL }}
          SAUDE_TOKEN: ${{ secrets.SAUDE_TOKEN }}
        run: bash scripts/publicacao/esperar-saude.sh

  cenarios:
    # Auditoria 6.8: produção só a partir da main (o ramo escolhido no "Run workflow" não passa daqui).
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/cenarios.yml
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  producao:
    needs: cenarios
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: producao          # configurar no GitHub com aprovação obrigatória do dono
    timeout-minutes: 120
    concurrency:
      group: publicacao-producao
      cancel-in-progress: false
    steps:
      - name: Só a main vai para a produção
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::A produção só é publicada a partir da main (pedido em $GITHUB_REF)."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Cliente do PostgreSQL 17 (mesma versão do Supabase)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Conferir os segredos da cópia e esconder a senha do banco no log
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COPIA_CHAVE: ${{ secrets.COPIA_CHAVE }}
        run: |
          faltam=""
          for n in DATABASE_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY COPIA_CHAVE; do
            [ -n "${!n}" ] || faltam="$faltam $n"
          done
          if [ -n "$faltam" ]; then
            echo "::error::Sem cópia não há migração. Cadastre no ambiente producao do GitHub:$faltam (docs/operacao.md, seção 2.3)."
            exit 1
          fi
          node -e 'const u = new URL(process.env.DATABASE_URL); if (u.password) console.log("::add-mask::" + decodeURIComponent(u.password))'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cópia do banco e dos arquivos antes da migração
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COPIA_CHAVE: ${{ secrets.COPIA_CHAVE }}
        run: pnpm copia:fazer --saida "$RUNNER_TEMP/copia/antes-da-publicacao-$(date -u +%Y-%m-%d)-${GITHUB_SHA::7}.enc"
      - uses: actions/upload-artifact@v4
        with:
          name: copia-antes-da-publicacao-${{ github.run_number }}
          path: ${{ runner.temp }}/copia/*.enc
          # Basta até a próxima publicação dar certo; a cópia semanal guarda 60 dias.
          retention-days: 14
          # Já está cifrada: comprimir não ajuda.
          compression-level: 0
          if-no-files-found: error
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSAO }}
      - name: Marcar o início da migração
        run: echo "INICIO=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Migração do banco
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" && supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      - name: Publicar os contêineres (depois da migração)
        env:
          WEBHOOK_TRABALHADOR: ${{ secrets.EASYPANEL_DEPLOY_TRABALHADOR }}
          WEBHOOK_PAINEL: ${{ secrets.EASYPANEL_DEPLOY_PAINEL }}
        run: bash scripts/publicacao/publicar-conteineres.sh
      - name: Conferir o trabalhador novo no /saude
        env:
          SAUDE_URL: ${{ secrets.TRABALHADOR_SAUDE_URL }}
          SAUDE_TOKEN: ${{ secrets.SAUDE_TOKEN }}
        run: bash scripts/publicacao/esperar-saude.sh
