name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm -r --filter '!@escritorio/db' --filter '!@escritorio/trabalhador' --filter '!@escritorio/copia' test
  banco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0 # auditoria 6.8: fixa, a mesma do deploy.yml
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - run: supabase test db
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/env-local.sh
      - run: pnpm --filter @escritorio/db test
      - run: pnpm --filter @escritorio/trabalhador test
      # Auditoria 6.2: ensaio de cópia e restauração (pg_dump/psql 17 do contêiner do Supabase local).
      - run: pnpm --filter @escritorio/copia test
        env:
          COPIA_PG_DOCKER: supabase_db_AGENTESDEIA
      - run: pnpm --filter @escritorio/painel exec playwright install --with-deps chromium
      - run: pnpm --filter @escritorio/painel e2e
